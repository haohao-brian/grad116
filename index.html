const KIND={dl:["報名截止","--dl"],up:["上傳／推薦函","--up"],ex:["筆試","--ex"],iv:["面試／口試","--iv"]};
const SHORT={ncku_ai:"成大 AI學程",nchu_ds:"中興 資科所",ntut_imf:"北科 資財",ntut_ai:"北科 AI學程",ntut_sec:"北科 資安學程",ntust_mb:"台科 資管乙",ntust_ma:"台科 資管甲",ntust_tm:"台科 科管所",ntust_sec:"台科 資安班",yuntech_ds:"雲科 數據所",ntpu_im:"北大 資管",nchu_mis:"中興 資管",nchu_ec:"中興 電商甲",nchu_tm:"中興 科管甲",ccu_ait:"中正 會資乙",nycu_ms:"陽明交大 管科乙",nycu_iot:"陽明交大 物聯網",ncue_im:"彰師 資管",yuntech_im:"雲科 資管"};
const P={};G.forEach(g=>g.p.forEach(p=>{p.c=g.c;p.g=g.n;P[p.id]=p}));
let st;try{st=JSON.parse(document.getElementById("state").textContent)}catch(e){st={}}
st.checked=st.checked||{};st.custom=st.custom||{};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const key=(pid,sid)=>pid+"."+sid;
const items=p=>[...p.docs.map(d=>({k:d,name:DOCN[d],shared:1})),...p.st.map(s=>({k:key(p.id,s[0]),name:s[1]})),...(st.custom[p.id]||[]).map(c=>({k:key(p.id,c.id),name:c.t,cid:c.id}))];
const miss=p=>items(p).filter(i=>!st.checked[i.k]);
const TODAY=(()=>{const d=new Date(Date.now()+8*36e5);return d.toISOString().slice(0,10)})();
const WD=["日","一","二","三","四","五","六"];
const byDate={};Object.entries(EV).forEach(([id,es])=>es.forEach(([d,k,l])=>(byDate[d]=byDate[d]||[]).push({id,k,l,d})));
const order={dl:0,up:1,ex:2,iv:3};Object.values(byDate).forEach(a=>a.sort((x,y)=>order[x.k]-order[y.k]));
function chip(e){const p=P[e.id],m=miss(p).length,past=e.d<TODAY;const badge=(e.k==="dl"||e.k==="up")?(m?`<b>缺${m}</b>`:`<b class="ok">✓</b>`):"";
 return `<button class="ev${past?" past":""}" style="--k:var(${KIND[e.k][1]})" data-open="${esc(e.id)}" title="${esc(SHORT[e.id]+" "+e.l)}"><span class="full">${esc(SHORT[e.id])}・${esc(e.l)}</span><span class="sh">${esc(SHORT[e.id])}</span>${badge}</button>`}
function months(){const out=[];for(const [y,m] of [[2026,11],[2026,12],[2027,1],[2027,2],[2027,3]]){
 const first=new Date(Date.UTC(y,m-1,1)),start=first.getUTCDay(),days=new Date(Date.UTC(y,m,0)).getUTCDate();
 let cells=WD.map(w=>`<div class="wd">${w}</div>`).join("");
 const total=Math.ceil((start+days)/7)*7;
 for(let i=0;i<total;i++){const dd=i-start+1;if(dd<1||dd>days){cells+=`<div class="day out"></div>`;continue}
  const iso=`${y}-${String(m).padStart(2,"0")}-${String(dd).padStart(2,"0")}`;
  cells+=`<div class="day${iso===TODAY?" today":""}"><div class="n">${dd}</div>${(byDate[iso]||[]).map(chip).join("")}</div>`}
 out.push(`<section class="month"><h2>${y} 年 ${m} 月</h2><div class="cal">${cells}</div></section>`)}
 return out.join("")}
function agenda(){return Object.keys(byDate).sort().filter(d=>d>=TODAY).map(d=>{const dt=new Date(d+"T00:00:00Z");
 return `<div class="ag-day${d===TODAY?" today":""}"><div class="ag-d">${dt.getUTCMonth()+1}/${dt.getUTCDate()}<small>週${WD[dt.getUTCDay()]}</small></div><div>${byDate[d].map(chip).join("")}</div></div>`}).join("")}
function row(i,pid){const on=!!st.checked[i.k];return `<div class="r"><label class="chk${on?" done":""}"><input type="checkbox" data-k="${esc(i.k)}"${on?" checked":""}><span><em>${esc(i.name)}</em>${i.shared?"<small>共用</small>":""}</span></label>${i.cid?`<button class="x" data-del="${esc(pid)}|${esc(i.cid)}">刪除</button>`:""}</div>`}
function drawerHtml(id){
 if(id==="docs"){const mi=DOCS.filter(d=>!st.checked[d[0]]),dn=DOCS.filter(d=>st.checked[d[0]]);
  const r=d=>row({k:d[0],name:d[1]+(d[2]?"（"+d[2]+"）":"")},"");
  return `<button class="close" data-close="1" aria-label="關閉">×</button><h3>共用資料</h3><p class="meta">勾掉後，所有用到這份資料的科系都會一起更新。</p>${mi.length?`<div class="miss"><div class="mh">還缺 ${mi.length} 份</div>${mi.map(r).join("")}</div>`:`<div class="ok">都備齊了 ✓</div>`}${dn.length?`<details class="more"><summary>已備好 ${dn.length} 份</summary>${dn.map(r).join("")}</details>`:""}`}
 const p=P[id];if(!p)return"";const all=items(p),m=all.filter(i=>!st.checked[i.k]),dn=all.filter(i=>st.checked[i.k]);
 const ds=(EV[id]||[]).map(([d,k,l])=>{const t=new Date(d+"T00:00:00Z");return `<div><i style="background:var(${KIND[k][1]})"></i>${t.getUTCMonth()+1}/${t.getUTCDate()}（${WD[t.getUTCDay()]}）${esc(l)}</div>`}).join("")||`<div>${esc(p.dt)}</div>`;
 return `<button class="close" data-close="1" aria-label="關閉">×</button><div class="meta" style="color:${p.c}">${esc(p.g)}</div><h3 style="--c:${p.c}"><b>${esc(p.s)}</b> ${esc(p.t)}</h3><div class="meta">${p.m.map(x=>`<span>${esc(x)}</span>`).join("")}</div>${p.warn?`<div class="warn">⚠ ${esc(p.warn)}</div>`:""}<div class="dates">${ds}</div>
 ${m.length?`<div class="miss"><div class="mh">還缺 ${m.length} 項</div>${m.map(i=>row(i,id)).join("")}</div>`:`<div class="ok">全部完成 ✓</div>`}
 <details class="more"><summary>${dn.length?`已完成 ${dn.length} 項・`:""}新增項目</summary>${dn.map(i=>row(i,id)).join("")}<form class="add" data-add="${esc(id)}"><input name="t" placeholder="新增項目…" maxlength="60" aria-label="新增項目"><button>加入</button></form></details>`}
let cur=null;
function remember(){try{cur?sessionStorage.setItem("xf_open",cur):sessionStorage.removeItem("xf_open")}catch(e){}}
function openD(id){cur=id;remember();const d=document.getElementById("drawer");d.innerHTML=drawerHtml(id);document.getElementById("dw").className="open";d.focus()}
function closeD(){cur=null;remember();document.getElementById("dw").className=""}
function board(){return G.map(g=>`<section class="grp" style="--c:${g.c}"><h2>${esc(g.n)}<small>${g.p.length} 個</small></h2>${g.p.map(p=>{const m=miss(p).length;
 return `<button class="pc" data-open="${esc(p.id)}"><h4><span><b>${esc(p.s)}</b>${esc(p.t)}</span><i class="${m?"":"ok"}">${m?"缺 "+m:"✓"}</i></h4><div class="row">報名截止 <em>${esc(p.dt)}</em></div><div class="row">${p.m.map(esc).join("　")}</div>${p.warn?`<div class="row" style="color:var(--miss)">⚠ ${esc(p.warn)}</div>`:""}</button>`}).join("")}</section>`).join("")}
function render(){
 document.getElementById("board").innerHTML=board();
 const all=Object.values(P);const nx=Object.keys(byDate).sort().filter(d=>d>=TODAY).flatMap(d=>byDate[d]).find(e=>e.k==="dl"&&miss(P[e.id]).length);
 const nd=DOCS.filter(d=>!st.checked[d[0]]).length;

  `<button class="docbtn" data-open="docs">共用資料${nd?`・缺 ${nd} 份`:" ✓"}</button>`+(nx?`<button class="next" data-open="${esc(nx.id)}">下一個截止：${esc(SHORT[nx.id])} ${esc(P[nx.id].dt)}・缺 ${miss(P[nx.id]).length} 項</button>`:"");

 if(cur)document.getElementById("drawer").innerHTML=drawerHtml(cur);
}

try{const v=localStorage.getItem(LS);if(v){const o=JSON.parse(v);st.checked=o.checked||st.checked;st.custom=o.custom||{}}}catch(e){}
function flash(t){const s=document.getElementById("save");s.textContent=t;s.classList.add("on");clearTimeout(flash.t);flash.t=setTimeout(()=>s.classList.remove("on"),1600)}
function queue(){render();try{localStorage.setItem(LS,JSON.stringify(st));flash("已儲存")}catch(e){flash("這個瀏覽器無法存檔，請用匯出進度備份")}}
function setTab(){const h=location.hash==="#calendar"?"calendar":"list";document.getElementById("v-list").hidden=h!=="list";document.getElementById("v-calendar").hidden=h!=="calendar";document.querySelectorAll(".tabs a").forEach(a=>{if(a.dataset.tab===h)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current")})}
window.addEventListener("hashchange",setTab);
document.addEventListener("click",async e=>{const b=e.target.closest("[data-io]");if(!b)return;const a=b.dataset.io,box=document.getElementById("iobox"),tx=document.getElementById("iotext"),msg=document.getElementById("iomsg");
 if(a==="export"){const s=JSON.stringify(st);tx.value=s;box.hidden=false;try{await navigator.clipboard.writeText(s);msg.textContent="已複製，到另一台裝置按「匯入進度」貼上"}catch(_){tx.select();msg.textContent="請手動複製下面的文字"}}
 if(a==="import"){tx.value="";box.hidden=false;tx.focus();msg.textContent="把匯出的文字貼進來，按套用"}
 if(a==="cancel"){box.hidden=true;msg.textContent=""}
 if(a==="apply"){try{const o=JSON.parse(tx.value);if(!o||typeof o.checked!=="object")throw 0;st.checked=o.checked;st.custom=o.custom||{};queue();box.hidden=true;msg.textContent="已套用"}catch(_){msg.textContent="格式不對，請貼上完整的匯出文字"}}});
document.addEventListener("change",e=>{const k=e.target.dataset&&e.target.dataset.k;if(!k)return;if(e.target.checked)st.checked[k]=true;else delete st.checked[k];queue()});
document.addEventListener("submit",e=>{const f=e.target.closest("form[data-add]");if(!f)return;e.preventDefault();const v=f.t.value.trim();if(!v)return;(st.custom[f.dataset.add]=st.custom[f.dataset.add]||[]).push({id:"c"+Date.now().toString(36),t:v});queue()});

 const d=e.target.closest("[data-del]");if(d){const [pid,cid]=d.dataset.del.split("|");st.custom[pid]=(st.custom[pid]||[]).filter(c=>c.id!==cid);delete st.checked[key(pid,cid)];queue()}});

function setTheme(t){const r=document.documentElement;if(t==="light"||t==="dark")r.dataset.theme=t;else{delete r.dataset.theme;t="auto"}try{localStorage.setItem("xinfang116_theme",t)}catch(e){}document.querySelectorAll("[data-theme-set]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.themeSet===t))}
